apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local kind overlay. The service images are built locally and loaded into the kind
# node with `kind load docker-image` (see scripts/kind-deploy.sh), so they carry the
# ":local" tag and must never be pulled from a registry.
resources:
  - ../../base

# Keep the laptop demo within a single kind node's CPU and memory budget.
replicas:
  - name: order-service
    count: 1
  - name: inventory-service
    count: 1
  - name: payment-service
    count: 1
  - name: fulfillment-service
    count: 1

images:
  - name: sagaharbor/order-service
    newTag: local
  - name: sagaharbor/inventory-service
    newTag: local
  - name: sagaharbor/payment-service
    newTag: local
  - name: sagaharbor/fulfillment-service
    newTag: local
